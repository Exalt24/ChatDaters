name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    timeout-minutes: 30
    name: Rails API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: development
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/graph_ql_development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1
        with:
          working-directory: backend
          bundler-cache: true
      - name: Rubocop
        run: bin/rubocop
      # bin/brakeman forces --ensure-latest, which fails whenever a new Brakeman ships.
      # EOLRails is skipped: it only reports that Rails 8.0 reached end of life.
      - name: Brakeman
        run: bundle exec brakeman --no-pager -q --except EOLRails
      - name: Load the schema into Postgres
        run: bin/rails db:create db:schema:load
      - name: Eager load every class
        run: bin/rails zeitwerk:check

  frontend:
    timeout-minutes: 30
    name: Vue app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
