version: 2
updates:
  - package-ecosystem: bundler
    directory: "/backend"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      weekly-bundler:
        update-types: [minor, patch]
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # primevue 4+ drops the primevue/resources/themes CSS this app imports and needs a styled-mode theme rewrite
      - dependency-name: "primevue"
        update-types: ["version-update:semver-major"]
      # @vue/apollo-option 4.2.2 peers on @apollo/client ^3, and apollo-upload-client 19+ and graphql 17 need @apollo/client 4
      - dependency-name: "@apollo/client"
        update-types: ["version-update:semver-major"]
      # tailwindcss 4 moves the PostCSS plugin to @tailwindcss/postcss and needs a config migration
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "apollo-upload-client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
    groups:
      weekly-npm:
        update-types: [minor, patch]
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "ruby"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]